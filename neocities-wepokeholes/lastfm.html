<!DOCTYPE html>
<html lang="en" style="height: fit-content; width: fit-content">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Last.fm Now Playing</title>
</head>
<body  style="min-height: 0px; height: fit-content; width: fit-content; background-image: none; margin: 0px; padding: 0px;">
    <table style="border: 2.5px solid #707070; height:120px; width:300px;">
        <tr>
            <td rowspan="3" style="align-content: center; justify-content: center; padding:1px;"><img style="width:105px; height:105px;" id="album-cover"></td>
            <td id="track"></td>
        </tr>
        <tr>
            <td id="artist"></td>
        </tr>
        <tr>
            <td id="date"></td>
        </tr>
    </table>
</body>
<script src="lastfm.js"></script>
</html>
